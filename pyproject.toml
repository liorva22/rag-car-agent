[project]
name = "rag-car-agent"
version = "1.0.0"
description = "Pure RAG over NHTSA recalls, owner complaints and EPA fuel-economy data, with citations and refusals."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "fastembed>=0.9",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carrag"]

[tool.setuptools.package-data]
carrag = ["static/*.html"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long lines left are prompt text

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
